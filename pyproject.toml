[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-to-api"
version = "0.1.0"
description = "Compile a Jupyter notebook into a FastAPI microservice"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
notebook-to-api = "backend.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true

[tool.ruff.lint]
# Bug-finding rules only (syntax errors, undefined names, invalid
# comparisons); style rules would need a repo-wide cleanup.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Quoted return annotations naming classes these modules never import.
"backend/observability/deployment_governance_delivery_runtime.py" = ["F821"]
"backend/observability/deployment_governance_persistence.py" = ["F821"]
