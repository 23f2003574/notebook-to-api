[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-to-api"
version = "0.1.0"
description = "Compile a Jupyter notebook into a FastAPI microservice"
readme = "README.md"
requires-python = ">=3.11"
# The versions the CI matrix runs the complete suite on (see .github/workflows/tests.yml and
# tests/test_python_version_gate.py, which keeps the two in step).
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["dependencies"]

[project.scripts]
notebook-to-api = "backend.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true

[tool.ruff.lint]
# Bug-finding rules only (syntax errors, undefined names, invalid
# comparisons, F811 silently shadowed definitions); style rules would need a repo-wide cleanup.
select = ["E9", "F63", "F7", "F82", "F811"]

# Coverage of the security-sensitive modules, measured over the whole suite on Python 3.13 (see the
# "Run tests with coverage" step in .github/workflows/tests.yml). Measured 96% overall when this was
# added (isolated_execution.py 71%: code that runs in forked children is not traced). The floor sits
# below that so only a real loss of coverage fails CI; raise it when coverage rises, never lower it
# to make a build pass.
[tool.coverage.run]
source = ["backend"]
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
fail_under = 90
include = [
    "backend/dashboard.py",
    "backend/auth_metrics.py",
    "backend/dashboard_keys.py",
    "backend/dashboard_rate_limit.py",
    "backend/dashboard_compile_slots.py",
    "backend/serve.py",
    "backend/runtime/isolated_execution.py",
    "backend/runtime/execution_limits.py",
    "backend/generator/api_generator.py",
    "backend/generator/docker_generator.py",
    "backend/generator/kubernetes_generator.py",
]
