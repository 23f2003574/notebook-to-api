name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Each run takes ~30 minutes. A new push to a pull request supersedes its
# earlier runs, so those are cancelled. Every push to main gets its own group
# (the commit SHA) and is never cancelled: with one shared group, GitHub drops
# all but the newest queued run, and most commits never got a CI verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:

    runs-on: ubuntu-latest

    # The suite takes minutes; without a limit a single hung test (a server
    # waiting on a socket, a subprocess that never exits) holds the runner for
    # GitHub's 6-hour default before the run is reported as failed.
    timeout-minutes: 60

    # The generated Dockerfile uses the Python that compiled the notebook, so a
    # 3.13 compile ships a 3.13 image; test both ends of what is supported.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-dev.txt

      # A matrix entry that silently ran on another interpreter would pass without testing the
      # version it names.
      - name: Check the interpreter is the matrix version
        run: |
          python -c "import sys; v='%d.%d' % sys.version_info[:2]; print('Python', sys.version); assert v == '${{ matrix.python-version }}', v"

      - name: Lint
        run: |
          ruff check backend tests

      - name: Run tests
        run: |
          pytest

  # Nothing above ever builds a generated image, so a Dockerfile or
  # requirements.txt that no longer installs would only surface at deploy
  # time. Build the sample for real and run its container's /health.
  docker-smoke:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt

      - name: Build the sample notebook's image and smoke-test it
        run: python -m backend.cli deploy notebooks/sample.ipynb --output smoke_app --smoke-test

      # --resolve-versions pins what is not installed here with pip's resolver; building the
      # image then proves the resolved requirements.txt really installs.
      - name: Resolve, pin and build a notebook whose library is not installed
        run: |
          python - <<'PY'
          import nbformat
          nb = nbformat.v4.new_notebook()
          nb.cells.append(nbformat.v4.new_code_cell("import tabulate\ndef table(a: int) -> str:\n    return tabulate.tabulate([[a]])\n"))
          nbformat.write(nb, "pinned.ipynb")
          PY
          python -m backend.cli compile pinned.ipynb --output pinned_app --resolve-versions --require-pinned
          grep -E '^tabulate==' pinned_app/requirements.txt
          docker build -t n2a-pinned pinned_app

      - name: Start the sample's generated compose project and check /health
        run: |
          pip install pytest
          pytest tests/test_compose_runtime_smoke.py

  frontend:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same scripts as package.json; none needs environment variables (the VITE_* settings
      # are optional and default to the local development URLs).
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Real browser against the real dashboard (built frontend served by backend.dashboard) with
  # throwaway directories: compile -> audit record -> open it -> verify the chain.
  browser-e2e:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run e2e
