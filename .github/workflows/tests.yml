name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Each run takes ~30 minutes. A new push to a pull request supersedes its
# earlier runs, so those are cancelled. Every push to main gets its own group
# (the commit SHA) and is never cancelled: with one shared group, GitHub drops
# all but the newest queued run, and most commits never got a CI verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:

    runs-on: ubuntu-latest

    # The suite takes minutes; without a limit a single hung test (a server
    # waiting on a socket, a subprocess that never exits) holds the runner for
    # GitHub's 6-hour default before the run is reported as failed.
    timeout-minutes: 60

    # The generated Dockerfile uses the Python that compiled the notebook, so a
    # 3.13 compile ships a 3.13 image; test both ends of what is supported.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-dev.txt

      # A matrix entry that silently ran on another interpreter would pass without testing the
      # version it names.
      - name: Check the interpreter is the matrix version
        run: |
          python -c "import sys; v='%d.%d' % sys.version_info[:2]; print('Python', sys.version); assert v == '${{ matrix.python-version }}', v"

      - name: Lint
        run: |
          ruff check backend tests

      - name: Run tests
        run: |
          pytest

  # Nothing above ever builds a generated image, so a Dockerfile or
  # requirements.txt that no longer installs would only surface at deploy
  # time. Build the sample for real and run its container's /health.
  docker-smoke:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt

      - name: Build the sample notebook's image and smoke-test it
        run: python -m backend.cli deploy notebooks/sample.ipynb --output smoke_app --smoke-test

      # --resolve-versions pins what is not installed here with pip's resolver; building the
      # image then proves the resolved requirements.txt really installs.
      - name: Resolve, pin and build a notebook whose library is not installed
        run: |
          python - <<'PY'
          import nbformat
          nb = nbformat.v4.new_notebook()
          nb.cells.append(nbformat.v4.new_code_cell("import tabulate\ndef table(a: int) -> str:\n    return tabulate.tabulate([[a]])\n"))
          nbformat.write(nb, "pinned.ipynb")
          PY
          # --require-pinned also demands a digest-pinned base image: resolve today's python:3.13-slim.
          BASE_DIGEST=$(docker buildx imagetools inspect python:3.13-slim --format '{{.Manifest.Digest}}')
          python -m backend.cli compile pinned.ipynb --output pinned_app --resolve-versions --require-pinned \
            --base-image "python@${BASE_DIGEST}"
          grep -E '^FROM python@sha256:[0-9a-f]{64}$' pinned_app/Dockerfile
          grep -E '^tabulate==' pinned_app/requirements.txt
          docker build -t n2a-pinned pinned_app

      - name: Start the sample's generated compose project and check /health
        run: |
          pip install pytest
          pytest tests/test_compose_runtime_smoke.py

  # The dashboard's own image: built with the documented command from the generated files, then
  # run for real -- health with and without the key, the built UI, a non-root user, the container
  # health check, and a production start that must refuse non-durable audit storage.
  dashboard-image:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt

      - name: Generate the dashboard deployment files
        run: python -m backend.cli dashboard-deployment --output dashboard-deployment

      - name: Build the image with the documented command
        run: docker build -f dashboard-deployment/Dockerfile -t notebook2api-dashboard .

      - name: Run it with a volume and check /api/health, the UI and the user
        env:
          KEY: ci-dashboard-key-0123456789abcdef
        run: |
          docker volume create n2a-data
          # read-only root filesystem and no capabilities, as the generated compose and Kubernetes files run it
          docker run -d --name dash -p 8001:8001 -v n2a-data:/data --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e NOTEBOOK_API_DASHBOARD_KEY=$KEY notebook2api-dashboard
          for i in $(seq 1 60); do curl -fsS -H "X-API-Key: $KEY" localhost:8001/api/health >/dev/null && break; sleep 1; done
          curl -fsS -H "X-API-Key: $KEY" localhost:8001/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8001/api/health)" = 401
          curl -fsS localhost:8001/ | grep -q 'id="root"'
          test "$(docker exec dash id -u)" = 1000
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy ] && break; sleep 3; done
          test "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy
          curl -fsS -H "X-API-Key: $KEY" localhost:8001/api/health | python -c "import json,sys; d=json.load(sys.stdin)['notebook_storage']; assert d['durable'], d"

      - name: State survives replacing the container
        env:
          KEY: ci-dashboard-key-0123456789abcdef
        run: |
          api() { curl -fsS -H "X-API-Key: $KEY" "$@"; }
          python - <<'PY'
          import nbformat
          nb = nbformat.v4.new_notebook()
          nb.cells.append(nbformat.v4.new_code_cell("def add(a: int, b: int) -> int:\n    return a + b\n"))
          nbformat.write(nb, "keep.ipynb")
          nb.cells[0].source += "\n# second version\n"
          nbformat.write(nb, "keep2.ipynb")
          PY
          api -F "file=@keep.ipynb;filename=keep.ipynb" localhost:8001/api/upload >/dev/null
          api -F "file=@keep2.ipynb;filename=keep.ipynb" "localhost:8001/api/upload?overwrite=true" >/dev/null
          api -H 'Content-Type: application/json' -d '{"notebook_path":"keep.ipynb","per_notebook":true}' localhost:8001/api/compile >/dev/null
          docker rm -f dash
          docker run -d --name dash -p 8001:8001 -v n2a-data:/data --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e NOTEBOOK_API_DASHBOARD_KEY=$KEY notebook2api-dashboard
          for i in $(seq 1 60); do api localhost:8001/api/health >/dev/null && break; sleep 1; done
          api localhost:8001/api/notebooks | python -c "import json,sys; n=json.load(sys.stdin)['notebooks']; assert [x['filename'] for x in n]==['keep.ipynb'], n; assert n[0]['per_notebook_app']['status']=='compiled', n"
          api localhost:8001/api/notebooks/keep.ipynb/versions | python -c "import json,sys; v=json.load(sys.stdin)['versions']; assert len(v)==1, v"
          api "localhost:8001/governance/audit/history?notebook=keep.ipynb" | python -c "import json,sys; r=json.load(sys.stdin)['records']; assert any(x['action']=='notebook.compile' for x in r), r"
          api localhost:8001/governance/audit/verify | python -c "import json,sys; assert json.load(sys.stdin)['valid']"

      - name: Validate the generated Kubernetes manifests against the Kubernetes schemas
        run: |
          set -euo pipefail
          # SHA-256 of kubeconform-linux-amd64.tar.gz as published in the v0.6.7 release's CHECKSUMS file;
          # a download that differs is never extracted or run.
          KUBECONFORM_SHA256=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 dashboard-deployment/kubernetes.yaml

      - name: Production start refuses non-durable audit storage
        env:
          KEY: ci-dashboard-key-0123456789abcdef
        run: |
          docker rm -f dash
          set +e
          timeout 90 docker run --rm -e NOTEBOOK_API_DASHBOARD_KEY=$KEY -e NOTEBOOK2API_GOVERNANCE_DATABASE_PATH=/tmp/audit.db notebook2api-dashboard 2>&1 | tee start.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0 -a "$code" -ne 124
          grep -qi "not durable" start.log

      - name: Container logs
        if: failure()
        run: docker logs dash || true

  frontend:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same scripts as package.json; none needs environment variables (the VITE_* settings
      # are optional and default to the local development URLs).
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Real browser against the real dashboard (built frontend served by backend.dashboard) with
  # throwaway directories: compile -> audit record -> open it -> verify the chain.
  browser-e2e:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: frontend
        run: npm run e2e

  # Known-vulnerable dependencies: the Python packages exactly as the constraints install them, and the
  # frontend's production dependencies. A finding fails the job; fix it by upgrading (Dependabot opens
  # the pull requests) rather than by suppressing the advisory.
  dependency-audit:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Audit the Python dependencies
        run: |
          python -m venv app-env
          app-env/bin/pip install -c constraints.txt -r requirements.txt
          python -m pip install pip-audit==2.10.1
          pip-audit --path "$(app-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit the frontend production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
